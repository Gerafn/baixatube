name: Gerar Instalador Windows

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar Codigo Fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Baixar FFmpeg para Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "bin\ffmpeg.zip"
          Expand-Archive -Path "bin\ffmpeg.zip" -DestinationPath "bin\temp" -Force
          Move-Item -Path "bin\temp\*\bin\ffmpeg.exe" -Destination "bin\ffmpeg.exe" -Force
          Remove-Item -Recurse -Force "bin\temp"
          Remove-Item -Force "bin\ffmpeg.zip"

      - name: Compilar com PyInstaller
        run: |
          pyinstaller --noconsole --onedir --name "BaixaTube" --add-data "frontend;frontend" --add-data "backend;backend" --add-data "bin;bin" desktop.py --clean -y

      - name: Instalar Inno Setup
        run: |
          choco install innosetup -y

      - name: Compilar Instalador .EXE com Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Salvar Artefato do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador_BaixaTube_Windows
          path: Output/Instalador_BaixaTube_v1.0.exe

      - name: Publicar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Instalador_BaixaTube_v1.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
